<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>NOVA CORE — Site vitrine 3D interactif en temps réel</title>
    <meta
      name="description"
      content="NOVA CORE est une démonstration de site vitrine 3D immersif : scène Three.js temps réel, animations liées au défilement, qualité adaptative, exploration interactive et repli complet sans WebGL."
    />
    <meta name="author" content="Démonstration Three.js et React Three Fiber" />
    <meta name="theme-color" content="#04060e" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />
    <!--
      Renseigner l'URL absolue du site une fois le domaine connu, par exemple :
      <link rel="canonical" href="https://exemple.tld/" />
      Une URL relative n'a pas de sens pour un canonique et empêche la
      compilation (Vite tente de la résoudre comme une ressource).
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOVA CORE" />
    <meta property="og:title" content="NOVA CORE — Site vitrine 3D interactif" />
    <meta
      property="og:description"
      content="Une structure modulaire dont la coque s'ouvre au fil du défilement. Rendu Three.js temps réel, qualité adaptative et accessibilité soignée."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:alt" content="Aperçu de la scène 3D NOVA CORE" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA CORE — Site vitrine 3D interactif" />
    <meta
      name="twitter:description"
      content="Démonstration de site vitrine 3D : Three.js, React Three Fiber, GSAP ScrollTrigger, qualité adaptative."
    />
    <meta name="twitter:image" content="./og-image.png" />
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="max-width: 44rem; margin: 4rem auto; padding: 0 1.5rem; color: #e9eefc">
        <h1>NOVA CORE</h1>
        <p>
          Cette démonstration de site vitrine 3D nécessite JavaScript pour afficher la scène
          interactive et le contenu détaillé.
        </p>
        <p>
          NOVA CORE est un objet de démonstration composé d'un noyau lumineux, de trois anneaux
          gyroscopiques, d'une coque métallique de six panneaux et de quatre émetteurs, présenté
          au-dessus d'un socle holographique. Le site présente trois piliers techniques — puissance
          adaptative, architecture lumineuse et contrôle intelligent — ainsi qu'un mode de qualité
          graphique adaptatif à trois niveaux.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
